[project]
name = "ipo-monitor"
version = "0.2.0"
description = "Personal Korean IPO RSS collection and opinion analysis CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
]

[project.scripts]
ipo-monitor = "ipo_monitor:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
